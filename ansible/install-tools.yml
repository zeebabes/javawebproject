---
- name: Install tools for Kubernetes (Ubuntu)
  hosts: master
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required base tools
      apt:
        name:
          - unzip
          - curl
          - python3
          - python3-pip
          - git
          - software-properties-common
        state: present

    - name: Ensure pip3 is available
      command: which pip3
      register: pip3_check
      failed_when: pip3_check.rc != 0

    - name: Install AWS CLI using pip3
      pip:
        name: awscli
        executable: pip3

    - name: Get latest kubectl version
      shell: curl -sL https://dl.k8s.io/release/stable.txt
      register: kubectl_version

    - name: Download and install kubectl
      become: yes
      shell: |
        curl -LO https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      args:
        chdir: /tmp
        creates: /usr/local/bin/kubectl


    - name: Install Kops
      get_url:
        url: https://github.com/kubernetes/kops/releases/download/v1.28.0/kops-linux-amd64
        dest: /usr/local/bin/kops
        mode: '0755'
...