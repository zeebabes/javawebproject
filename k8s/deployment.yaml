apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-web-project3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-web-project3
  template:
    metadata:
      labels:
        app: java-web-project3
    spec:
      containers:
        - name: java-web-project3
          image: kemiagbabiaka/java-web-project3:latest
          ports:
            - containerPort: 8080
